https://github.com/aktsonthalia/bottled"}, {"id": "2610.08675", "title": "Same-Number Citation Swaps: Stress-Testing Jev as a Financial Evidence Judge", "short": "Same-number citation swaps", "kind": "Paper", "date": "2026-10-06", "updated": "2026-10-06", "added": "2026-10-07", "url": "https://arxiv.org/abs/2610.08675", "pdf": "https://arxiv.org/pdf/2610.08675v1", "version": "2610.08675v1", "authors": ["Chuhong Xu", "Bo Su", "Ziyao Chen", "Ruiyang Xu", "Shimeng Dai", "Xinyu Qiu"], "target": "hosted", "categories": ["trustworthiness/reliability"], "contributions": ["research", "evaluation"], "brief_en": "Holds arithmetic and operand values fixed while swapping financial citations; Jev misses some wrong-role evidence and rejects some equivalent evidence, with column rendering changing the trade-off.", "brief_zh": "固定算术与操作数后交换财务引文；Jev 既会漏检错误角色证据，也会拒绝等价证据，显式列标题改变两者权衡。", "summary": "Holds arithmetic and operand values fixed while swapping financial citations; Jev misses some wrong-role evidence and rejects some equivalent evidence, with column rendering changing the trade-off.", "summary_zh": "固定算术与操作数后交换财务引文；Jev 既会漏检错误角色证据，也会拒绝等价证据，显式列标题改变两者权衡。", "theme": "Reliability", "scope": "hosted-jev", "schema_version": 2, "evidence": "Preprint", "review": "Methods, principal results and limitations read from full text", "limitation": "Signed-number matching explains most recovery. Natural labels are assistant judgments; the fresh follow-up has one reviewer, and excluding one disputed case removes the net separation gain.", "datasets": ["FinQA citation-swap audit"], "code": ""}, {"id": "2610.08155", "title": "Token-Efficient Multi-Agent Collaboration via System One-Guided Computational Division of Labor", "short": "S1-MAS", "kind": "Paper", "date": "2026-10-06", "updated": "2026-10-06", "added": "2026-10-07", "url": "https://arxiv.org/abs/2610.08155", "pdf": "https://arxiv.org/pdf/2610.08155v1", "version": "2610.08155v1", "authors": ["Zihan Zhou", "Xinzhe Hu", "Hanxu Yang", "Lian ds confidence-centric skipping of unscored tuples once predicted output targets are guaranteed.", "summary_zh": "形式化按贡献加权的语义查询质量；v2 新增基于置信度的跳过规则，在保证预测输出目标后不再为剩余元组评分。", "theme": "Foundations", "scope": "related-model", "schema_version": 2, "evidence": "Preprint", "review": "Methods, principal results and limitations read from full text", "limitation": "Simulation assumes calibrated Bernoulli labels and a perfect escalation judge in its main setting. Ratio-of-expectations quality is approximate; no real-engine Jev evaluation is reported.", "datasets": ["CASQO synthetic workloads"], "code": ""}, {"id": "2610.07953", "title": "Benchmarking System One Models in Online Moderation", "short": "System One online moderation", "kind": "Paper", "date": "2026-10-06", "updated": "2026-10-06", "added": "2026-10-07", "url": "https://arxiv.org/abs/2610.07953", "pdf": "https://arxiv.org/pdf/2610.07953v1", "version": "2610.07953v1", "authors": ["Federico Mazzoni", "Andrea Failla"], "target": "mixed", "categories": ["trustworthiness/reliability", "trustworthiness/safety"], "contributions": ["research", "evaluation"], "brief_en": "Separates moderation rules, retrieved precedents and answer inventories across five benchmarks; Jev benefits from precedents in matched settings, while Laya often changes its operating point without better discrimination.", "brief_zh": "在五个基准上分离审核规则、检索先例和答案集合；匹配条件下 Jev 从先例获益，Laya 则常仅改变判定比例而未提升区分能力。", "summary": "Separates moderation rules, retrieved precedents and answer inventories across five benchmarks; Jev benefits from precedents in matched settings, while Laya often changes its operating point without better discrimination.", "summary_zh": "在五个基准上分离审核规则、检索先例和答案集合；匹配条件下 Jev 从先例获益，Laya 则常仅改变判定比例而未提升区分能力。", "theme": "Reliability", "scope": "related-model", "schema_version": 2, "evidence": "Preprint", "review": "Methods, principal results and limitations read from full text", "limitation": "PluRule held-out EMA improves by 5.20 points with precedents. External reference systems are not input-matched; leave-one-out retrieval is distinct from held-out deployment and intervals are not multiplicity-adjusted.", "datasets": ["SOM moderation benchmark suite"], "code": "https://github.com/FedericoMz/som-moderation-benchmark"}, {"id": "2610.07730", "title": "SanSi: A Looped Typed Decision Model for System 1.5 Thinking", "short": "SanSi", "kind": "Paper", "date": "2026-10-06", "updated": "2026-10-06", "added": "2026-10-07", "url": "https://arxiv.org/abs/2610.07730", "pdf": "https://arxiv.org/pdf/2610.07730v1", "version": "2610.07730v1", "authors": ["Shuyu Gan", "Young-Jun Lee", "Dongyeop Kang"], "target": "open", "categories": ["foundations/architecture", "foundations/inference", "trustworthiness/reliability"], "contributions": ["research", "evaluation"], "brief_en": "Trains typed readouts after repeated backbone loops; eight loops improve accuracy at fixed model shape, but cost more compute and calibrate worse than three loops.", "brief_zh": "在重复骨干循环后训练类型化读出；八次循环提升同结构模型准确率，但计算更贵，校准不如三次循环。", "summary": "Trains typed readouts after repeated backbone loops; eight loops improve accuracy at fixed model shape, but cost more compute and calibrate worse than three loops.", "summary_zh": "在重复骨干循环后训练类型化读出；八次循环提升同结构模型准确率，但计算更贵，校准不如三次循环。", "theme": "Foundations", "scope": "related-model", "schema_version": 2, "evidence": "Preprint", "review": "Methods, principal results and limitations read from full text", "limitation": "Accuracy reaches 72.0% at 7.7 times one-loop GPU time. A larger single-pass reference is stronger per compute; confidence rises on wrong answers and ECE increases from loop 3 to 8.", "datasets": ["SanSi decision suite"], "code": ""}, {"id": "2610.07716", "title": "Readout Stability in Prefill-Only Decision Models:Zero-Label Prediction and Inference-Time Compute Allocation", "short": "Readout stability and compute allocation", "kind": "Paper", "date": "2026-10-06", "updated": "2026-10-06", "added": "2026-10-07", "url": "https://arxiv.org/abs/2610.07716", "pdf": "https://arxiv.org/pdf/2610.07716v1", "version": "2610.07716v1", "authors": ["Ran Li", "Lei Chen"], "target": "open", "categories": ["foundations/inference", "trustworthiness/reliability"], "contributions": ["research", "evaluation"], "brief_en": "Tests cached first-pass rankings under candidate-menu changes and compares re-asking with model cascades; ranking stability supports computation reuse but does not itself identify unlabeled accuracy.", "brief_zh": "测试候选菜单变化后的首轮缓存排序，并比较重复询问与模型级联；排序稳定支持计算复用，本身不能识别无标签准确率。", "summary": "Tests cached first-pass rankings under candidate-menu changes and compares re-asking with model cascades; ranking stability supports computation reuse but does not itself identify unlabeled accuracy.", "summary_zh": "测试候选菜单变化后的首轮缓存排序，并比较重复询问与模型级联；排序稳定支持计算复用，本身不能识别无标签准确率。", "theme": "Foundations", "scope": "related-model", "schema_version": 2, "evidence": "Preprint", "review": "Methods, principal results and limitations read from full text", "limitation": "Section 3.2 computes accuracy by comparison with y(x), despite the zero-label claim. Gold-retaining menu curation and ranking stability do not establish deployable label-free accuracy; prose and abstract differ on dataset counts.", "datasets": ["Readout-stability intervention suite"], "code": "https://github.com/rlisml/jev-cascade"}, {"id": "r-142d11a9f5", "title": "rlisml/jev-cascade", "short": "Jev confidence cascades", "kind": "Project", "date": "2026-10-06", "updated": "2026-10-06", "added": "2026-10-07", "url": "https://github.com/rlisml/jev-cascade", "version": "2026-10-06T08:38:19Z", "authors": ["rlisml"], "target": "open", "categories": ["foundations/inference", "trustworthiness/reliability"], "contributions": ["tool", "evaluation"], "brief_en": "Provides candidate-menu interventions, cached-ranking analysis and confidence cascades for open prefill-only decision models; costs are modeled in forward-pass units.", "brief_zh": "提供开放预填充决策模型的候选菜单干预、缓存排序分析和置信度级联；成本按前向计算单位建模。", "summary": "Provides candidate-menu interventions, cached-ranking analysis and confidence cascades for open prefill-only decision models; costs are modeled in forward-pass units.", "summary_zh": "提供开放预填充决策模型的候选菜单干预、缓存排序分析和置信度级联；成本按前向计算单位建模。", "theme": "Foundations", "scope": "related-model", "schema_version": 2, "evidence": "Repository", "review": "Original README and associated paper reviewed", "limitation": "Gold-retaining menus are diagnostic controls; parameter-ratio costs are not measured deployment bills. Accuracy scoring still requires reference labels."}, {"id": "2610.09683", "title": "System Switch: When Should a Fast Decision Model Stop and Think?", "short": "System Switch", "kind": "Paper", "date": "2026-10-07", "updated": "2026-10-07", "added": "2026-10-08", "url": "https://arxiv.org/abs/2610.09683", "pdf": "https://arxiv.org/pdf/2610.09683v1", "version": "2610.09683v1", "authors": ["Gian Luca Bailo"], "target": "open", "categories": ["foundations/inference", "trustworthiness/reliability"], "contributions": ["research", "evaluation"], "brief_en": "Tests confidence-based deferral from fast decision models to a slow visual reasoner; offline gains do not translate into Doom level completion.", "brief_zh": "测试快速决策模型按置信度转交慢速视觉推理器；离线收益未转化为 Doom 关卡通关。", "summary": "Tests confidence-based deferral from fast decision models to a slow visual reasoner; offline gains do not translate into Doom level completion.", "summary_zh": "测试快速决策模型按置信度转交慢速视觉推理器；离线收益未转化为 Doom 关卡通关。", "theme": "Foundations", "scope": "related-model", "schema_version": 2, "evidence": "Preprint", "review": "Methods, principal results and limitations read from full text", "limitation": "At 30% deferral, Laya gains 0.13 over random routing, but the gain over the best component is uncertain. No closed-loop run exits the level; oracle agreement, class composition and stale observations limit interpretation.", "datasets": ["System Switch Doom decisions"], "code": ""}, {"id": "2610.09328", "title": "Visual Jev Rewards: Reference-Bound Verification for Multi-Subject Image Generation", "short": "Visual Jev Rewards", "kind": "Paper", "date": "2026-10-07", "updated": "2026-10-07", "added": "2026-10-08", "url": "https://arxiv.org/abs/2610.09328", "pdf": "https://arxiv.org/pdf/2610.09328v1", "version": "2610.09328v1", "authors": ["Baoteng Li", "Wenzhuo Wu", "Kongming Liang", "Zhanyu Ma"], "target": "open", "categories": ["foundations/architecture", "trustworthiness/reliability"], "contributions": ["research", "evaluation"], "brief_en": "Trains a local Qwen verifier for joint reference identity and image conditions, then averages binary probabilities as an image-generation reward.", "brief_zh": "训练本地 Qwen 验证器联合判断参考身份与图像条件，将二元概率平均值用作图像生成奖励。", "summary": "Trains a local Qwen verifier for joint reference identity and image conditions, then averages binary probabilities as an image-generation reward.", "summary_zh": "训练本地 Qwen 验证器联合判断参考身份与图像条件，将二元概率平均值用作图像生成奖励。", "theme": "Foundations", "scope": "related-model", "schema_version": 2, "evidence": "Preprint", "review": "Methods, principal results and limitations read from full text", "limitation": "Custom score improves from 41.78 to 52.50 versus 51.84 for the 27B reward control. One training run per condition and the small human sample do not establish significant superiority. Mean rewards allow compensation for identity failures; this is not official Jev.", "datasets": ["Reference-bound Visual Jev evaluation suite"], "code": ""}, {"id": "2610.09188", "title": "From Probabilities to Decisions: Search and Multi-Teacher Distillation with Jev", "short": "Probabilities to Decisions", "kind": "Paper", "date": "2026-10-06", "updated": "2026-10-06", "added": "2026-10-08", "url": "https://arxiv.org/abs/2610.09188", "pdf": "https://arxiv.org/pdf/2610.09188v1", "version": "2610.09188v1", "authors": ["Mohamad Yazan Sadoun", "Sarah Sharif", "Yaser Mike Banad"], "target": "mixed", "categories": ["foundations/inference", "trustworthiness/reliability"], "contributions": ["research", "evaluation"], "brief_en": "Distills Jev and Qwen pairwise probabilities into small evaluators; matched-budget chess gains replicate, while retrieval gains remain uncertain.", "brief_zh": "将 Jev 与 Qwen 成对概率蒸馏到小型评估器；匹配预算的国际象棋收益可重复，检索收益仍不确定。", "summary": "Distills Jev and Qwen pairwise probabilities into small evaluators; matched-budget chess gains replicate, while retrieval gains remain uncertain.", "summary_zh": "将 Jev 与 Qwen 成对概率蒸馏到小型评估器；匹配预算的国际象棋收益可重复，检索收益仍不确定。", "theme": "Foundations", "scope": "related-model", "schema_version": 2, "evidence": "Preprint", "review": "Methods, principal results and limitations read from full text", "limitation": "Combining teachers gains 9.6 Elo [4.3,14.9] over Qwen with twice the pairs; replication gains 8.4 [2.9,14.1]. Stricter shuffle and refit controls weaken the advantage. Retrieval intervals include zero; search and hardware differences preclude attributing total strength or speed to Jev alone.", "datasets": ["Jev multi-teacher distillation suite"], "code": ""}, {"id": "2610.09937", "title": "Where Can a Decision Model Diagnose HVAC Faults? Reasoning Demand, Physical Representation, and Robustness Under Shift", "short": "HVAC reasoning and shift", "kind": "Paper", "date": "2026-10-07", "updated": "2026-10-07", "added": "2026-10-08", "url": "https://arxiv.org/abs/2610.09937", "pdf": "https://arxiv.org/pdf/2610.09937v1", "version": "2610.09937v1", "authors": ["Wooyoung Jung"], "target": "mixed", "categories": ["trustworthiness/reliability", "foundations/interfaces"], "contributions": ["research", "evaluation"], "brief_en": "Separates physical representation from reasoning in fault diagnosis; engineered features improve consistency, but stable shift performance does not imply superior absolute accuracy or useful detection.", "brief_zh": "在故障诊断中区分物理表征与推理需求；工程特征改善一致性，但迁移稳定不意味着绝对准确率更高或检测有效。", "summary": "Separates physical representation from reasoning in fault diagnosis; engineered features improve consistency, but stable shift performance does not imply superior absolute accuracy or useful detection.", "summary_zh": "在故障诊断中区分物理表征与推理需求；工程特征改善一致性，但迁移稳定不意味着绝对准确率更高或检测有效。", "theme": "Reliability", "scope": "related-model", "schema_version": 2, "evidence": "Preprint", "review": "Methods, principal results and limitations read from full text", "limitation": "Jev shift ECE falls from 0.28 to 0.17 after temperature scaling, with a summer exception. Fault-detection F1 0.73 lies inside the always-flag baseline interval. Same-day reference splits favor the supervised model; harmonization artifacts are available on request, not a verified public release.", "datasets": ["HVAC reasoning-demand study suite"], "code": ""}, {"id": "2610.12292", "title": "One Word Opens the Gate: The Option-Channel Attack on Typed Decision Models as Agent Guardrails", "short": "Option-channel guardrail attack", "kind": "Paper", "date": "2026-10-08", "updated": "2026-10-08", "added": "2026-10-09", "url": "https://arxiv.org/abs/2610.12292", "pdf": "https://arxiv.org/pdf/2610.12292v1", "version": "2610.12292v1", "authors": ["Seyedarmin Azizi", "Erfan Baghaei Potraghloo", "Massoud Pedram"], "target": "open", "categories": ["trustworthiness/security", "applications/agents"], "contributions": ["research", "evaluation"], "brief_en": "Separates fail-open and fail-closed errors in open decision-model guardrails; misleading option names can reverse decisions when labels enter the model input.", "brief_zh": "区分开放决策护栏的错误放行与错误拦截；选项名称进入模型输入时，误导名称可反转判断。", "summary": "Separates fail-open and fail-closed errors in open decision-model guardrails; misleading option names can reverse decisions when labels enter the model input.", "summary_zh": "区分开放决策护栏的错误放行与错误拦截；选项名称进入模型输入时，误导名称可反转判断。", "theme": "Reliability", "scope": "related-model", "schema_version": 2, "evidence": "Preprint", "review": "Methods, principal results and limitations read from full text", "limitation": "Option-label access is distinct from state-only injection. Models excluding labels from their input are invariant to renaming but remain vulnerable to text changes; synthetic policies do not establish production incident rates.", "datasets": ["GuardBench"], "code": "https://github.com/ArminAzizi98/option-channel-attack"}, {"id": "2610.11978", "title": "Specialized Decision Models vs. General-Purpose LLMs: Benchmarking Jev Across Knowledge, Reasoning, and Multilingual Tasks", "short": "Knowledge versus calculation", "kind": "Paper", "date": "2026-10-08", "updated": "2026-10-08", "added": "2026-10-09", "url": "https://arxiv.org/abs/2610.11978", "pdf": "https://arxiv.org/pdf/2610.11978v1", "version": "2610.11978v1", "authors": ["Xing Li", "Qingcheng Chang", "Jinzhong Ning", "Changfeng Xu", "Shenlong Zhang", "Yijia Zhang", "Ling Luo", "Hongfei Lin"], "target": "hosted", "categories": ["trustworthiness/reliability"], "contributions": ["research", "evaluation"], "brief_en": "Compares Jev with 19 LLMs on 13 benchmarks; strong knowledge scores coexist with a marked weakness on mathematical word problems.", "brief_zh": "在 13 项基准上比较 Jev 与 19 个 LLM；知识任务表现较强，数学文字题明显较弱。", "summary": "Compares Jev with 19 LLMs on 13 benchmarks; strong knowledge scores coexist with a marked weakness on mathematical word problems.", "summary_zh": "在 13 项基准上比较 Jev 与 19 个 LLM；知识任务表现较强，数学文字题明显较弱。", "theme": "Reliability", "scope": "hosted-jev", "schema_version": 2, "evidence": "Preprint", "review": "Methods, principal results and limitations read from full text", "limitation": "104 of 169 representative/small-model pairs use published scores with different prompts and reasoning settings. Rankings are rough comparisons, not a common-protocol causal test of architecture.", "datasets": ["Jev 13-benchmark evaluation"], "code": ""}, {"id": "2610.11901", "title": "Can Decision Models Understand Stance? Evaluating Jev Against General-Purpose LLMs", "short": "Stance and conversational context", "kind": "Paper", "date": "2026-10-08", "updated": "2026-10-08", "added": "2026-10-09", "url": "https://arxiv.org/abs/2610.11901", "pdf": "https://arxiv.org/pdf/2610.11901v1", "version": "2610.11901v1", "authors": ["Xing Li", "Jinzhong Ning", "Yijia Zhang", "Liang Yang", "Hongfei Lin"], "target": "hosted", "categories": ["trustworthiness/reliability"], "contributions": ["research", "evaluation"], "brief_en": "Jev matches GPT-5.6 on English VAST stance labels but trails stronger models on Chinese conversational stance, especially favor-versus-against distinctions.", "brief_zh": "Jev 在英文 VAST 立场判断上接近 GPT-5.6，在中文对话立场上落后于更强模型，尤其难区分支持与反对。", "summary": "Jev matches GPT-5.6 on English VAST stance labels but trails stronger models on Chinese conversational stance, especially favor-versus-against distinctions.", "summary_zh": "Jev 在英文 VAST 立场判断上接近 GPT-5.6，在中文对话立场上落后于更强模型，尤其难区分支持与反对。", "theme": "Reliability", "scope": "hosted-jev", "schema_version": 2, "evidence": "Preprint", "review": "Methods, principal results and limitations read from full text", "limitation": "Jev macro-F1 is 77.92 and 58.43. Stronger LLMs use batching while Jev uses single records; SFT references have one run and no paired predictions, and intervals lack multiplicity correction.", "datasets": ["VAST and ZS-CSD"], "code": ""}, {"id": "2610.11692", "title": "Can Jev be Your Q or Policy in Reinforcement Learning?", "short": "Frozen Jev in RL training", "kind": "Paper", "date": "2026-10-08", "updated": "2026-10-08", "added": "2026-10-09", "url": "https://arxiv.org/abs/2610.11692", "pdf": "https://arxiv.org/pdf/2610.11692v1", "version": "2610.11692v1", "authors": ["Yi Ma", "Tianpei Yang", "Yaodong Yang", "Weixun Wang", "Hongyao Tang"], "target": "hosted", "categories": ["foundations/frameworks", "trustworthiness/reliability"], "contributions": ["research", "evaluation"], "brief_en": "Uses frozen Jev as a policy reference, exploration judge and replay rater; gains depend on the learning role and supplied information.", "brief_zh": /pdf/2610.11379v1", "version": "2610.11379v1", "authors": ["Jie Ma", "Jie Gao", "Yihang Liu", "Zhike Qiu", "Junle Li", "Chongyi Zhuang", "Jiayi Ji", "Xiaoshuai Sun"], "target": "open", "categories": ["foundations/inference"], "contributions": ["research", "evaluation"], "brief_en": "Combines context-state reuse, candidate-prefix sharing and layer pruning for OmniJev; compact execution does not consistently reduce measured latency.", "brief_zh": "为 OmniJev 结合上下文状态复用、候选前缀共享及层剪枝；计算结构更紧凑不保证实测时延下降。", "summary": "Combines context-state reuse, candidate-prefix sharing and layer pruning for OmniJev; compact execution does not consistently reduce measured latency.", "summary_zh": "为 OmniJev 结合上下文状态复用、候选前缀共享及层剪枝；计算结构更紧凑不保证实测时延下降。", "theme": "Foundations", "scope": "related-model", "schema_version": 2, "evidence": "Preprint", "review": "Methods, principal results and limitations read from full text", "limitation": "Selected 43.75–45.83% candidate pruning retains 93.66–97.52% mean task scores, yet full-method geometric speedups are below one. The state-plus-pruning ablation is faster; LIBERO is offline QA, not robot success.", "datasets": ["FastJEV six-set evaluation"], "code": ""}, {"id": "2610.11316", "title": "MetaEncoder: Exploring the Limit of Bi-Encoders for Multimodal System One Decision Making with Natural Language Interface", "short": "MetaEncoder", "kind": "Paper", "date": "2026-10-08", "updated": "2026-10-08", "added": "2026-10-09", "url": "https://arxiv.org/abs/2610.11316", "pdf": "https://arxiv.org/pdf/2610.11316v1", "version": "2610.11316v1", "authors": ["Jianpeng Cheng", "Guangyu Sun", "Aashu Singh", "Benyu Zhang", "Haixing Dai", "Hossein Mansour", "Jiangfan Zhang", "Shlok Kumar Mishra", "Wei Sun", "Xuanming Cui", "Yanli Liu", "Qi Guo", "Max Xiangjun Fan", "Jun Xiao"], "target": "open", "categories": ["foundations/architecture", "foundations/interfaces"], "contributions": ["research", "evaluation"], "brief_en": "Trains a multimodal bi-encoder with request-to-candidate contrastive learning; including options in requests improves closed-set decisions while retaining cached candidate embeddings.", "brief_zh": "以请求到候选的对比学习训练多模态双编码器；将选项加入请求改善闭集判断，同时保留候选嵌入缓存。", "summary": "Trains a multimodal bi-encoder with request-to-candidate contrastive learning; including options in requests improves closed-set decisions while retaining cached candidate embeddings.", "summary_zh": "以请求到候选的对比学习训练多模态双编码器；将选项加入请求改善闭集判断，同时保留候选嵌入缓存。", "theme": "Foundations", "scope": "related-model", "schema_version": 2, "evidence": "Preprint", "review": "Methods, principal results and limitations read from full text", "limitation": "MetaEncoder trails OpenJev-27B on text decisions and WeMM on MMEB partitions. Format gains and low MMLU order variance do not establish general calibration; no independent weight-file verification was performed.", "datasets": ["MetaEncoder 190-task evaluation"], "code": ""}, {"id": "2610.11135", "title": "Can a System-One LLM Perform Knowledge Tracing When Few or No Learners Are Logged?", "short": "JevKT cold-start evaluation", "kind": "Paper", "date": "2026-10-08", "updated": "2026-10-08", "added": "2026-10-09", "url": "https://arxiv.org/abs/2610.11135", "pdf": "https://arxiv.org/pdf/2610.11135v1", "version": "2610.11135v1", "authors": ["Unggi Lee", "Haeun Park"], "target": "mixed", "categories": ["trustworthiness/reliability", "foundations/interfaces"], "contributions": ["research", "evaluation"], "brief_en": "Tests cold-start knowledge tracing with reader swaps and matched typed inputs; Jev benefits mainly from its model prior, while supervised methods catch up with more learners.", "brief_zh": "通过阅读器替换及匹配类型化输入测试冷启动知识追踪；Jev 主要受益于模型先验，学习者增加后监督方法追上。", "summary": "Tests cold-start knowledge tracing with reader swaps and matched typed inputs; Jev benefits mainly from its model prior, while supervised methods catch up with more learners.", "summary_zh": "通过阅读器替换及匹配类型化输入测试冷启动知识追踪；Jev 主要受益于模型先验，学习者增加后监督方法追上。", "theme": "Reliability", "scope": "related-model", "schema_version": 2, "evidence": "Preprint", "review": "Methods, principal results and limitations read from full text", "limitation": "Zero-shot mean AUC is .706 and eight-learner JevKT .722; the average crossover occurs between 64 and 128 learners. Adapter models emit probabilities as text; one closed model and limited reasoning backbones constrain attribution.", "datasets": ["JevKT seven-dataset suite"], "code": ""}, {"id": "2610.10615", "title": "JevForest: Path Voting for Budgeted Feature Acquisition", "short": "JevForest", "kind": "Paper", "date": "2026-10-07", "updated": "2026-10-07", "added": "2026-10-09", "url": "https://arxiv.org/abs/2610.10615", "pdf": "https://arxiv.org/pdf/2610.10615v1", "version": "2610.10615v1", "authors": ["Yu Yan"], "target": "hosted", "categories": ["foundations/inference"], "contributions": ["research", "evaluation"], "brief_en": "Uses tree-path voting to select semantic questions under a feature budget; fewer sequential questions cost more than batching in the tested pilots.", "brief_zh": "通过树路径投票在特征预算内选择语义问题；试验中较少的顺序问题比批量提问更贵。", "summary": "Uses tree-path voting to select semantic questions under a feature budget; fewer sequential questions cost more than batching in the tested pilots.", "summary_zh": "通过树路径投票在特征预算内选择语义问题；试验中较少的顺序问题比批量提问更贵。", "theme": "Foundations", "scope": "hosted-jev", "schema_version": 2, "evidence": "Preprint", "review": "Methods, principal results and limitations read from full text", "limitation": "Four-question accuracy is .729 on AG News and .667 on TREC, with reversed baseline rankings. Eight-question batches are faster, cheaper and more accurate; small selected samples and exploratory configurations preclude general dominance.", "datasets": ["JevForest acquisition evaluation"], "code": ""}, {"id": "r-b462883ae2", "title": "fstandhartinger/jevbench", "short": "JevBench by Benchmark Heaven", "kind": "Project", "date": "2026-09-19", "updated": "2026-10-10", "added": "2026-10-10", " plications", "zh": "网络与系统安全应用"}}, {"id": "applications/agents", "parent": "applications", "label": {"en": "Agent & Tool Security", "zh": "智能体与工具安全"}}, {"id": "applications/code", "parent": "applications", "label": {"en": "Code & Supply-chain Security", "zh": "代码与供应链安全"}}, {"id": "applications/intrusion", "parent": "applications", "label": {"en": "Intrusion & Anomaly Detection", "zh": "入侵与异常检测"}}, {"id": "applications/phishing", "parent": "applications", "label": {"en": "Phishing & Fraud Detection", "zh": "钓鱼与欺诈检测"}}, {"id": "applications/access", "parent": "applications", "label": {"en": "Access Control", "zh": "访问控制"}}, {"id": "applications/industrial", "parent": "applications", "label": {"en": "Industrial & Infrastructure Security", "zh": "工业与基础设施安全"}}, {"id": "applications/operations", "parent": "applications", "label": {"en": "Security Operations", "zh": "安全运营"}}], "contributions": [{"id": "research", "label": {"en": "Research", "zh": "原创研究"}}, {"id": "survey", "label": {"en": "Survey", "zh": "综述"}}, {"id": "benchmark", "label": {"en": "Benchmark", "zh": "基准"}}, {"id": "dataset", "label": {"en": "Dataset", "zh": "数据集"}}, {"id": "evaluation", "label": {"en": "Evaluation", "zh": "评测"}}, {"id": "method", "label": {"en": "Method", "zh": "方法"}}, {"id": "attack", "label": {"en": "Attack", "zh": "攻击"}}, {"id": "defense", "label": {"en": "Defense", "zh": "防御"}}, {"id": "system", "label": {"en": "System", "zh": "系统"}}, {"id": "tool", "label": {"en": "Tool", "zh": "工具"}}, {"id": "tutorial", "label": {"en": "Tutorial", "zh": "教程"}}, {"id": "documentation", "label": {"en": "Documentation", "zh": "文档"}}, {"id": "analysis", "label": {"en": "Analysis", "zh": "分析"}}, {"id": "model", "label": {"en": "Model", "zh": "模型"}}], "models": [{"id": "hosted", "label": {"en": "TypeSafe Jev", "zh": "TypeSafe 官方 Jev"}}, {"id": "open", "label": {"en": "Other open decision models", "zh": "其他开放决策模型"}}, {"id": "mixed", "label": {"en": "Jev + other models", "zh": "Jev 与其他模型"}}], "comparisons": {"2610.02076": {"category": "foundations", "id": "2610.02076", "datasets": ["Public JevBench", "Banking77", "CLINC150"], "data_role": {"en": "Uses existing decision and intent-routing benchmarks", "zh": "使用已有决策与意图路由基准"}, "design": {"en": "Compares frozen candidate logits with task-targeted fine-tuning and checks transfer to other capabilities.", "zh": "对比冻结模型候选读出与针对性微调，并检查其他能力的迁移。"}, "reading": {"en": "Useful for separating readout changes from training gains; adaptation is most helpful for specific weaknesses.", "zh": "可区分读出变化与训练收益；针对具体短板的适配更有价值。"}, "source_section": "Sections 3–4", "source": "https://arxiv.org/pdf/2610.02076v1"}, "2609.25845": {"category": "foundations", "id": "2609.25845", "datasets": ["GQA", "SNLI-VE", "TextVQA"], "data_role": {"en": "Converts existing visual tasks to candidate-choice workloads", "zh": "将已有视觉任务转换为候选选择任务"}, "design": {"en": "Controls task adaptation and decision-head choice separately from prefix reuse and batching.", "zh": "将任务适配、决策头与前缀复用、批处理分别控制。"}, "reading": {"en": "Shared execution improves efficiency; the dedicated head has no consistent accuracy advantage.", "zh": "共享执行提高效率；专用决策头没有稳定的准确率优势。"}, "source_section": "Experimental setup; Tables 1–2", "source": "https://arxiv.org/pdf/2609.25845v1"}, "2609.29283": {"category": "foundations", "id": "2609.29283", "datasets": ["Oxford-IIIT Pets", "DTD", "ScienceQA", "A-OKVQA"], "data_role": {"en": "Uses recognition and visual-question benchmarks", "zh": "使用图像识别与视觉问答基准"}, "design": {"en": "Compares frozen inference, language-side adaptation and matched prompt-only controls.", "zh": "对比冻结推理、语言侧适配与匹配的纯提示对照。"}, "reading": {"en": "Accuracy gains depend on adaptation and task; valid output does not establish calibrated probabilities.", "zh": "准确率收益依赖适配与任务；输出合法不代表概率已校准。"}, "source_section": "Experimental setup and matched prompt-only follow-up", "source": "https://arxiv.org/pdf/2609.29283v1"}, "2609.35342": {"category": "trustworthiness", "id": "2609.35342", "datasets": ["Sys1Cal-v1"], "data_role": {"en": "Introduces a constructed-probability dataset", "zh": "提出真概率已知的构造数据集"}, "design": {"en": "Queries the same events through Choice, Noul and Score; evaluates full probability distributions.", "zh": "对同一事件调用 Choice、Noul、Score，并评价完整概率分布。"}, "reading": {"en": "Tests probability meaning directly; it answers a different question from classification accuracy.", "zh": "直接检验概率的数值含义，不能用分类准确率替代。"}, "source_section": "Dataset construction and evaluation", "source": "https://arxiv.org/pdf/2609.35342v1"}, "2609.31142": {"category": "trustworthiness", "id": "2609.31142", "datasets": ["JevAdvBench"], "data_role": {"en": "Introduces typed-request adversarial scenarios", "zh": "提出类型化请求的对抗场景基准"}, "design": {"en": "Compares single-field edits against the clean decision and an identical-request noise baseline.", "zh": "将单字段编辑与干净决策、完全相同请求的重复噪声对比。"}, "reading": {"en": "Measures decision changes under perturbation; flips are not automatically errors against independent labels.", "zh": "衡量扰动下的决策变化；翻转不自动等于独立真值上的错误。"}, "source_section": "Benchmark construction and evaluation protocol", "source": "https://arxiv.org/pdf/2609.31142v1"}, "2609.37647": {"category": "trustworthiness", "id": "2609.37647", "datasets": ["SST-2", "HellaSwag", "WinoGrande", "CommonsenseQA", "BoolQ"], "data_role": {"en": "Combines existing public datasets; selected examples shown", "zh": "组合已有公开数据集；此处列举部分"}, "design": {"en": "Uses fixed task templates to compare classification, calibration and selective prediction across primitives.", "zh": "采用固定任务模板，比较不同原语的分类、校准与选择性预测。"}, "reading": {"en": "Broad task coverage reveals interface-dependent behavior; task distributions and split choices still differ.", "zh": "广泛任务覆盖显示接口依赖行为，但任务分布与划分方式并不相同。"}, "source_section": "Section 3.2 and Appendix A", "source": "https://arxiv.org/pdf/2609.37647v1"}, "zenodo-chaos": {"category": "trustworthiness", "id": "zenodo-chaos", "datasets": ["ChaosNLI"], "data_role": {"en": "Reuses human-disagreement annotations", "zh": "使用人类意见分歧标注"}, "design": {"en": "Separates easier and harder agreement cases and corrects sampling bias in calibration estimates.", "zh": "分开评估不同分歧程度，并校正校准估计的采样偏差。"}, "reading": {"en": "Assesses confidence against human agreement; disagreement is not a single objective correctness label.", "zh": "检验置信度与人类一致程度的关系；分歧不等于单一客观正误标签。"}, "source_section": "Preregistered protocol and calibration analysis", "source": "https://zenodo.org/api/records/23032384/files/jevbench_paper_Khosla_2026_v1.1.pdf/content"}, "2609.33401": {"category": "applications", "id": "2609.33401", "datasets": ["WAInjectBench", "R-Judge", "AgentHarm"], "data_role": {"en": "Uses original labels from agent-security benchmarks", "zh": "使用代理安全基准的原始标签"}, "design": {"en": "Separates calibration, threshold selection and held-out testing; compares attack groups and escalation policies.", "zh": "分离校准、阈值选择与留出测试，比较攻击组与升级策略。"}, "reading": {"en": "Aggregate calibration can mask unsafe misses in particular groups; strict risk constraints limit automatic approval.", "zh": "总体校准可能掩盖特定攻击组的漏检；严格风险约束限制自动放行。"}, "source_section": "Section 3: datasets and partitions", "source": "https://arxiv.org/pdf/2609.33401v2"}, "2609.34862": {"category": "applications", "id": "2609.34862", "datasets": ["R-Judge", "ATBench500", "TraceSafe subset", "MCPHunt"], "data_role": {"en": "Uses original and study-revised behavior labels", "zh": "结合原始标签与研究修订的行为标签"}, "design": {"en": "Applies a common risk rubric and reports detection quality, valid-result coverage and inference cost separately.", "zh": "统一风险标准，分别报告检测质量、有效结果覆盖和推理成本。"}, "reading": {"en": "Label revisions matter when comparing studies; retrospective trace classification is not online blocking.", "zh": "跨研究比较需核对标签修订；事后轨迹分类不等于在线阻断。"}, "source_section": "Benchmark collections; Table 1", "source": "https://arxiv.org/pdf/2609.34862v1"}, "2609.34963": {"category": "applications", "id": "2609.34963", "datasets": ["CyberSecEval Instruct"], "data_role": {"en": "Reuses code examples and benchmark CWE labels", "zh": "使用已有代码样本与基准 CWE 标签"}, "design": {"en": "Holds the repair model fixed while changing the weakness classifier; evaluates with the Insecure Code Detector.", "zh": "固定修复模型，改变弱点分类器，再用 Insecure Code Detector 评价。"}, "reading": {"en": "Detector-measured security improves; the experiment does not prove all vulnerabilities are removed or functionality preserved.", "zh": "检测器测得的安全性改善，不代表所有漏洞消失或功能完全保持。"}, "source_section": "Sections 3.1–3.2 and limitations", "source": "https://arxiv.org/pdf/2609.34963v1"}, "2610.01079": {"category": "applications", "id": "2610.01079", "datasets": ["NSL-KDD"], "data_role": {"en": "Uses a small pilot from an existing intrusion dataset", "zh": "从已有入侵数据集开展小规模试验"}, "design": {"en": "Compares typed intrusion decisions under limited labels; distinguish the paper snapshot from later repository runs.", "zh": "比较有限标签下的类型化入侵决策；区分论文快照与仓库后续实验。"}, "reading": {"en": "Useful as an initial IDS study, with live-traffic validity and deployment false alarms still unestablished.", "zh": "可作为初步 IDS 研究，真实流量有效性与部署误报仍待验证。"}, "source_section": "Experimental protocol in arXiv v1", "source": "https://arxiv.org/pdf/2610.01079v1"}, "2610.02048": {"category": "applications", "id": "2610.02048", "datasets": ["EPANET C-Town", "EPANET Net3", "EPANET Net1"], "data_role": {"en": "Builds simulated attack and fault scenarios", "zh": "构造仿真攻击与故障场景"}, "design": {"en": "Tests sealed rounds and transfer networks; sends uncertain or rule-disagreed cases to an LLM reviewer.", "zh": "使用封闭轮次与迁移网络测试，将不确定或规则不一致的案例交给 LLM 复核。"}, "reading": {"en": "Rule agreement can reduce review workload; evidence is from simulation rather than an operating water utility.", "zh": "规则一致性门控可减少复核负载；证据来自仿真而非实际供水运行。"}, "source_section": "Sections 2.1–2.10", "source": "https://arxiv.org/pdf/2610.02048v1"}, "2609.24574": {"id": "2609.24574", "category": "trustworthiness", "datasets": ["CSS annotation suite (Ziems et al.)"], "data_role": {"en": "Uses released CSS task splits with adjudicated labels; compares native decision probabilities with verbalized LLM confidence.", "zh": "使用公开社科任务划分与裁定标签；区分原生决策概率和大模型口述置信度。"}, "design": {"en": "18 tasks and 7,977 items; matched prompts, open-model ablations, per-task calibration and coverage–accuracy curves.", "zh": "18 个任务、7,977 条样本；匹配提示，开放模型消融，逐任务校准与覆盖率—准确率曲线。"}, "reading": {"en": "An aggregate calibration advantage does not justify one automation threshold across constructs; benchmark labels do not capture all annotator disagreement.", "zh": "总体校准优势不支持跨任务共用自动化阈值；基准裁定标签也不完全代表标注分歧。"}, "source_section": "Sections 3–6", "source": "https://arxiv.org/pdf/2609.24574v2"}, "2609.24052": {"id": "2609.24052", "category": "trustworthiness", "datasets": ["Texas crash narratives / human audit"], "data_role": {"en": "Uses restricted crash narratives and a weighted human-reference audit; aggregate outputs and analysis code are reported released.", "zh": "使用受限事故叙事和加权人工审计；论文声明公开聚合结果与分析代码。"}, "design": {"en": "2,416 usable human judgments; recalibration fits and tests on separate narrative halves with repeated splits, avoiding judgment-level leakage.", "zh": "2,416 条可用人工判断；按叙事划分拟合和测试集并重复切分，避免同一叙事的判断跨组泄漏。"}, "reading": {"en": "Internal split evaluation supports within-corpus recalibration, not transfer to a new region or time period. Raw narratives are restricted; row-level audit release remains conditional.", "zh": "内部划分支持同语料后校准，不能证明跨地区或时间迁移。原始叙事受限，逐项审计数据公开仍有条件。"}, "source_section": "Section 3, Eq. 20; Sections 4.2–4.4; Data and code availability", "source": "https://arxiv.org/pdf/2609.24052v1"}, "2609.24965": {"id": "2609.24965", "category": "trustworthiness", "datasets": ["Scientific semantic-choice cases"], "data_role": {"en": "Constructs source-grounded scientific cases with separate semantic and downstream references.", "zh": "构造有来源依据的科学案例，分别提供语义选择与下游结果参照。"}, "design": {"en": "Ten cases, twenty choices, twelve configurations and five repeats; reports planned-request coverage separately from successful-response accuracy.", "zh": "十个案例、二十个选择、十二种配置、五次重复；区分计划请求覆盖率与成功响应准确率。"}, "reading": {"en": "Repeats estimate variability on the same cases, not a larger independent sample. Useful as an evaluation protocol, not evidence of broad scientific or security competence.", "zh": "重复调用只估计同批案例的波动，不扩大独立样本。可借鉴评测协议，不能据此证明广泛科学或安全能力。"}, "source_section": "Sections 2–3; Appendices A–C", "source": "https://arxiv.org/pdf/2609.24965v2"}, "r-a7fb827376": {"id": "r-a7fb827376", "category": "trustworthiness", "datasets": ["Judgment-layer audit battery", "Banking77"], "data_role": {"en": "Constructed judgment batteries and an intent-classification subset", "zh": "自建裁判测试集与意图分类子集"}, "design": {"en": "Separates client wall time, provider fields and access-layer truncation; pairs judge and LLM errors on identical items.", "zh": "区分客户端计时、服务自报字段与接入层截断；在相同样本上配对比较裁判和大模型错误。"}, "reading": {"en": "Many failure analyses concern Laya, not Jev. Small samples, missing artifacts and multiplicity limit conclusions; autonomous long-horizon runs were not executed.", "zh": "Laya 的失败不能直接归于 Jev；时延样本有限，部分统计缺可核验产物，多重校正后相关性未确立，未执行自主长流程。"}, "source_section": "Sections 7–8, 10; corrections in v2", "source": "https://zenodo.org/api/records/22901853/files/paper-en.pdf/content"}, "2610.00831": {"id": "2610.00831", "category": "foundations", "datasets": ["Banking77", "Public JevBench"], "data_role": {"en": "Existing public datasets or released benchmark artifacts", "zh": "已有公开数据或发布的基准工件"}, "design": {"en": "Prior normalization and cyclic option rotations; the public JevBench subset scores 213 of 231 items.", "zh": "先验归一化与循环选项置换；公开 JevBench 子集评估 231 项中的 213 项。"}, "reading": {"en": "No weight training, but prior strength and temperature use labels. Extra rotations cost forwards; the serving stopping bound needs separate selection and certification data.", "zh": "没有权重训练，但先验强度和温度使用标签；置换增加前向成本，服务停止界限需区分选择集与认证集。"}, "source_section": "Section 6; Section 9", "source": "https://arxiv.org/pdf/2610.00831v1"}, "2609.33671": {"id": "2609.33671", "category": "applications", "datasets": ["DUCS-Bench", "SafetyBench-ZH"], "data_role": {"en": "Existing public datasets or released benchmark artifacts", "zh": "已有公开数据或发布的基准工件"}, "design": {"en": "Validation-calibrated CPU gate and Laya cascade; tests clean held-out prompts, false positives and cross-domain transfer.", "zh": "在验证集校准 CPU 门控与 Laya 级联，测试干净留出提示、误报与跨域迁移。"}, "reading": {"en": "In-domain accuracy does not establish OOD robustness; paper separates specialization loss and replay recovery. Hardware and end-to-end serial timing must remain explicit.", "zh": "域内准确率不能替代域外鲁棒性；论文区分专门化损失和回放恢复，且必须保留硬件与串行端到端计时条件。"}, "source_section": "Evaluation sections and tables", "source": "https://arxiv.org/pdf/2609.33671v1"}, "zenodo-23066522": {"id": "zenodo-23066522", "category": "foundations", "datasets": ["Banking77", "CLINC150"], "data_role": {"en": "Existing public datasets or released benchmark artifacts", "zh": "已有公开数据或发布的基准工件"}, "design": {"en": "Benchmark-trained encoder with option-set attention and per-type temperature scaling; includes a verbatim contamination audit.", "zh": "在基准训练集训练选项集合注意力编码器并按类型温度校准，另做逐字污染审计。"}, "reading": {"en": "Hosted Jev numbers come from third parties with different prompts and samples; this is not a matched zero-shot comparison.", "zh": "托管 Jev 数字来自第三方、提示与样本不同，不是匹配的零样本对照。"}, "source_section": "Sections IX–X", "source": "https://zenodo.org/api/records/23066522/files/tron-1b-paper.pdf/content"}, "2610.03387": {"id": "2610.03387", "category": "trustworthiness", "datasets": ["Candidate-coverage frozen cases (Lu and Wu)"], "data_role": {"en": "Source-defined evaluation corpus; see linked original source for constituent datasets and splits.", "zh": "原文定义的评测资料；组成数据集和划分见链接原始来源。"}, "design": {"en": "300 calibration and 589 test texts across AG News, DBpedia, Emotion and TREC; 23,932 predictions per model, paired by text with calibration-only thresholds.", "zh": "AG News、DBpedia、Emotion、TREC 共 300 条校准与 589 条测试文本；每模型 23,932 次预测，按文本配对，阈值只用校准集选择。"}, "reading": {"en": "On five-candidate TREC, native Laya detects 97.2% of omissions but rejects 69.7% of valid controls; Jev gives 24.8%/0.0%. Threshold selection changes the operating points without guaranteeing population risk.", "zh": "TREC 五候选下 Laya 原生遗漏检测／错误拒答为 97.2%／69.7%，Jev 为 24.8%／0.0%。校准阈值改变运行点，但不构成总体风险保证。"}, "source_section": "Sections 4–7 and 9; PDF pp. 3–9", "source": "https://arxiv.org/pdf/2610.03387v1"}, "2610.03324": {"id": "2610.03324", "category": "applications", "datasets": ["HATEDECIDE evaluation suite"], "data_role": {"en": "Source-defined evaluation corpus; see linked original source for constituent datasets and splits.", "zh": "原文定义的评测资料；组成数据集和划分见链接原始来源。"}, "design": {"en": "Fully paired evaluation on Dynamic (4,120), MHS (3,203), HateXplain (1,924) and HateCheck (3,728); 10,000 linked-group bootstrap draws with family-wise Bonferroni adjustment.", "zh": "在 Dynamic 4,120、MHS 3,203、HateXplain 1,924、HateCheck 3,728 条文本上完全配对；按关联组做 10,000 次 bootstrap 并按比较族 Bonferroni 调整。"}, "reading": {"en": "Decomposition improves 6/30 comparisons and worsens 11/30. Jev approaches commercial quality cheaply on diagnostic HateCheck, but this does not establish the same trade-off on everyday moderation traffic.", "zh": "问题分解在 30 组对照中改善 6 组、恶化 11 组。Jev 在诊断性 HateCheck 上以较低费用接近商业模型，但不能直接外推日常审核流量。"}, "source_section": "Sections 3–5 and Table 4; PDF pp. 3–10", "source": "https://arxiv.org/pdf/2610.03324v1"}, "2610.03073": {"id": "2610.03073", "category": "applications", "datasets": ["SecJev-Corpus"], "data_role": {"en": "Source-defined evaluation corpus; see linked original source for constituent datasets and splits.", "zh": "原文定义的评测资料；组成数据集和划分见链接原始来源。"}, "design": {"en": "170,185 questions over 14 tasks; separate training, development, calibration and 21,634-question test splits grouped by source. Matching backbones and training budgets compare candidate scoring with one-token generation.", "zh": "14 项任务共 170,185 个问题；训练、开发、校准和 21,634 题测试独立，按来源组划分。同骨干同训练预算比较候选评分与单 token 生成。"}, "reading": {"en": "Accuracy closely matches generative SFT with smaller measured peak memory. Temperature scaling improves NLL but worsens ECE and Brier on security tests; new-source traffic false positives remain high.", "zh": "准确率接近生成式监督微调，实测峰值显存较小。安全测试中温度缩放改善 NLL，却恶化 ECE 与 Brier；新来源流量误报仍高。"}, "source_section": "Sections 4–6, Tables 3–5 and 9; PDF pp. 3–9", "source": "https://arxiv.org/pdf/2610.03073v1"}, "2610.06744": {"id": "2610.06744", "category": "foundations", "datasets": ["HakemBench v1.0"], "data_role": {"en": "Original evaluation corpus or source-defined study suite", "zh": "原始评测语料或论文定义的研究集合"}, "design": {"en": "182M-parameter model; sequential-head and REINFORCE controls, three seeds per recipe and 4,275 questions across seven tracks.", "zh": "182M 参数模型；对照顺序读出头与 REINFORCE，每方案三个种子，在七主题共 4,275 题上评估。"}, "reading": {"en": "Later runs were shaped by earlier test results in three tracks; first-run unseen support questions show smooth ECE rising from 0.027 to 0.045 after temperature scaling.", "zh": "后三个相关主题的训练受先前测试结果影响；首轮未见支持问题上，温度缩放使 smooth ECE 从 0.027 升至 0.045。"}, "source_section": "Sections 2–7; PDF pp. 2–7", "source": "https://arxiv.org/pdf/2610.06744v1"}, "2610.06625": {"id": "2610.06625", "category": "trustworthiness", "datasets": ["Seven political-science replication suite"], "data_role": {"en": "Original evaluation corpus or source-defined study suite", "zh": "原始评测语料或论文定义的研究集合"}, "design": {"en": "Human-coded references from seven published studies; matched GPT-6 Luna and Qwen comparisons, paired bootstrap and separate single-call versus order-averaged calibration.", "zh": "以七项已发表研究的人类编码为参考；匹配 GPT-6 Luna、Qwen 对照，配对 bootstrap，并区分单次与交换顺序平均后的概率校准。"}, "reading": {"en": "Luna costs use posted batch/standard rates, while latency uses synchronous calls; Qwen pricing describes its served route. Jev calibration exceeds Luna token readouts but not consistently Qwen.", "zh": "Luna 费用按公布的批处理／标准费率计算，时延来自同步请求；Qwen 费用对应托管路由。Jev 校准优于 Luna token 读出，对 Qwen 则无一致优势。"}, "source_section": "Table 2, calibration analysis and Appendix H; PDF pp. 6–18", "source": "https://arxiv.org/pdf/2610.06625v2"}, "2610.06425": {"id": "2610.06425", "category": "foundations", "datasets": ["SoK-JEV evidence corpus"], "data_role": {"en": "Original evaluation corpus or source-defined study suite", "zh": "原始评测语料或论文定义的研究集合"}, "design": {"en": "139 paper families, 429 coded scopes, independent coding and bounded event-model experiments with execution-time replay.", "zh": "139 个论文族、429 个编码范围，结合独立编码与执行时间回放的事件模型实验。"}, "reading": {"en": "Only four of fifty timing-fit claims have matched measurement. Replayed execution and one random stream limit the scope of the measured queueing results.", "zh": "50 项时序适配主张中有 4 项提供匹配测量；排队实验使用执行回放和单一随机流，结论对应该事件模型。"}, "source_section": "Sections 3–7 and 9; PDF pp. 3–15", "source": "https://arxiv.org/pdf/2610.06425v1"}, "2610.06354": {"id": "2610.06354", "category": "trustworthiness", "datasets": ["GraphDecide"], "data_role": {"en": "Original evaluation corpus or source-defined study suite", "zh": "原始评测语料或论文定义的研究集合"}, "design": {"en": "800 structural queries; matched graph/text contrasts on ogbn-arxiv and STaRK-Prime; four construction tasks with ten instances each and fixed-rule/proposal controls.", "zh": "800 个结构查询；ogbn-arxiv、STaRK-Prime 图文匹配对照；四项构造任务各十实例，包含固定规则及提案池对照。"}, "reading": {"en": "Jev recognizes adjacency well but is weaker at exact degree and articulation. Shared graph context and single executions limit uncertainty estimates; proposal assistance changes several inputs together.", "zh": "Jev 擅长邻接识别，精确度数与割点判断较弱。共享图上下文和单次执行影响不确定性估计；提案辅助同时改变多项输入。"}, "source_section": "Sections 3–5; PDF pp. 3–11", "source": "https://arxiv.org/pdf/2610.06354v1"}, "2610.04985": {"id": "2610.04985", "category": "trustworthiness", "datasets": ["Hidden Risks task suite"], "data_role": {"en": "Original evaluation corpus or source-defined study suite", "zh": "原始评测语料或论文定义的研究集合"}, "design": {"en": "Official Jev and local NanoJev; three synthetic decision tasks with 200 states each and three repeats, plus controlled training and four defensive detection tasks.", "zh": "比较官方 Jev 与本地 NanoJev；三个合成决策任务各 200 个状态、重复三次，另有可控训练和四项防御检测任务。"}, "reading": {"en": "High clean-task accuracy coexists with input-manipulation failures. Backdoor and membership results use controlled NanoJev data; factual knowledge probes are distinct from training membership.", "zh": "干净任务高准确率与输入操纵失效并存。后门及成员推断结论依赖 NanoJev 可控数据；事实知识探测与训练成员身份需分别解释。"}, "source_section": "Sections III–V, Tables I–III; PDF pp. 4–12", "source": "https://arxiv.org/pdf/2610.04985v1"}, "2610.04345": {"id": "2610.04345", "category": "foundations", "datasets": ["Wireless decision case studies"], "data_role": {"en": "Original evaluation corpus or source-defined study suite", "zh": "原始评测语料或论文定义的研究集合"}, "design": {"en": "Receive-antenna selection and 30 RAN-slicing instances over 21 feasible actions; exhaustive numerical references and client-observed latency.", "zh": "接收天线选择，以及 21 个可行动作上的 30 个 RAN 切片实例；采用穷举数值参考与客户端观测时延。"}, "reading": {"en": "Antenna capacity loss is 20.19% for Jev versus 9.46% for the norm heuristic. Slicing utility regret is comparable to the tested LLMs at over 3.5 times lower median response latency.", "zh": "天线选择中 Jev 容量损失为 20.19%，范数启发式为 9.46%；切片效用遗憾接近所测 LLM，中位响应时延降低超过 3.5 倍。"}, "source_section": "Section IV, Figures 2–6; PDF pp. 6–9", "source": "https://arxiv.org/pdf/2610.04345v1"}, "zenodo-23175660": {"id": "zenodo-23175660", "category": "trustworthiness", "datasets": ["ChaosNLI", "DICES-350"], "data_role": {"en": "Exact analytic targets and human vote distributions", "zh": "精确解析目标与人类投票分布"}, "design": {"en": "Mirror-paired coin witnesses, three base-rate wordings, separately collected holdout repeats and 650 ChaosNLI/DICES items; clustered bootstrap.", "zh": "镜像硬币证据、三种基率措辞、另行采集的留出重复及 650 条 ChaosNLI／DICES 样本；采用聚类 bootstrap。"}, "reading": {"en": "Normalized Noul reduces exact-target Brier error from 0.067 to 0.003. On disputed human labels neither primitive beats uniform prediction in the hardest strata; temperature calibration makes their average results similar.", "zh": "归一化 Noul 将精确目标 Brier 误差从 0.067 降至 0.003；在人类分歧最高的分层，两种接口均未胜过均匀预测，温度校准后总体结果接近。"}, "source_section": "Sections 3–5; PDF pp. 3–12", "source": "https://zenodo.org/api/records/23179064/files/velu-jev-calibration-audit.pdf/content"}, "r-32fd7c39ba": {"id": "r-32fd7c39ba", "category": "trustworthiness", "datasets": ["Jev PII evaluation suite"], "data_role": {"en": "500 synthetic texts, 500 business documents and 127 court judgments", "zh": "500 条合成文本、500 份商业文档和 127 份法院判决"}, "design": {"en": "Word-level F2/F1, PII leakage, paired document bootstrap, and 20 development documents per dataset for thresholds.", "zh": "逐词 F2／F1、PII 泄漏、按文档配对 bootstrap；各数据集 20 份开发文档用于阈值选择。"}, "reading": {"en": "On judgments Jev F2 is 0.834 versus Haiku 0.819, with paired difference interval crossing zero; Jev recall is higher but F1 is lower. Initial test errors informed later prompt changes.", "zh": "判决文本上 Jev F2 为 0.834、Haiku 为 0.819，差值区间跨零；Jev 召回较高而 F1 较低。早期测试错误参与了后续提示修改。"}, "source_section": "README Sections 01, 02, 05–07 and 10", "source": "https://github.com/AlanViollier/jev-vs-pii"}, "2610.08775": {"id": "2610.08775", "category": "foundations", "datasets": ["BOTTLED"], "data_role": {"en": "Original evaluation corpus or source-defined study suite", "zh": "原始评测语料或论文定义的研究集合"}, "design": {"en": "Ten models, three workloads and two runs per task; 10 hours and five million weighted tokens per run. Jev is evaluated on 1,000 ESCI and RAID items each.", "zh": "十模型、三任务，每组合两次；每轮十小时、五百万加权 token。Jev 在 ESCI 与 RAID 各 1,000 条样本上评估。"}, "reading": {"en": "48 of 60 artifact runs fall below the zero-shot confidence interval. Full-workload Jev costs are extrapolated; reported token/API cost excludes local compute, and two artifact runs provide limited variability evidence.", "zh": "60 次产物运行中 48 次低于零样本区间下界。Jev 全量费用来自外推；所报 token／API 费用不含本地计算，两次产物运行对变异的估计有限。"}, "source_section": "Sections 3–4; PDF pp. 4–8", "source": "https://arxiv.org/pdf/2610.08775v1"}, "2610.08675": {"id": "2610.08675", "category": "trustworthiness", "datasets": ["FinQA citation-swap audit"], "data_role": {"en": "Original evaluation corpus or source-defined study suite", "zh": "原始评测语料或论文定义的研究集合"}, "design": {"en": "192 traces from 96 selected FinQA questions; 15 initial contrasts and a fresh 36-page follow-up labeled by one non-author reviewer; question-level bootstrap.", "zh": "96 个筛选 FinQA 问题产生 192 条轨迹；15 组初始对照及 36 个新页面的后续对照，由一名非作者审核；按问题 bootstrap。"}, "reading": {"en": "Signed-number matching explains most recovery. Natural labels are assistant judgments; the fresh follow-up has one reviewer, and excluding one disputed case removes the net separation gain.", "zh": "带符号数字匹配解释了大部分恢复收益。自然轨迹标签来自助手判断；新样本仅一名审核者，排除一个争议案例即消除净分离收益。"}, "source_section": "Sections II–IV, Tables I–III; PDF pp. 2–8", "source": "https://arxiv.org/pdf/2610.08675v1"}, "2610.08155": {"id": "2610.08155", "category": "foundations", "datasets": ["S1-MAS evaluation suite"], "data_role": {"en": "Original evaluation corpus or source-defined study suite", "zh": "原始评测语料或论文定义的研究集合"}, "design": {"en": "Six reasoning/code benchmarks plus WebSRC, three seeds, matched GPT workers; random-controller, GPT-controller and reader-removal ablations.", "zh": "六个推理／代码基准加 WebSRC，三个种子、匹配 GPT 工作模型；含随机控制、GPT 控制和移除阅读器消融。"}, "reading": {"en": "The six-task mean is 93.97% versus DyLAN 93.12%. Token savings count GPT calls, not all local-model compute; latency includes controller and reader. This is Laya-based coordination, not a Jev API experiment.", "zh": "六任务均值为 93.97%，DyLAN 为 93.12%。节省量统计 GPT 调用 token，不含全部本地模型计算；时延包含控制器和阅读器。这是 Laya 协调实验，并非 Jev API 实验。"}, "source_section": "Sections 4–5, Tables 1–4; PDF pp. 4–8", "source": "https://arxiv.org/pdf/2610.08155v1"}, "2610.08089": {"id": "2610.08089", "category": "foundations", "datasets": ["CASQO synthetic workloads"], "data_role": {"en": "Original evaluation corpus or source-defined study suite", "zh": "原始评测语料或论文定义的研究集合"}, "design": {"en": "Formal relational semantics and synthetic 2,000-review workloads, 200 instances for main experiments and 50 for tuple-pricing comparisons.", "zh": "关系代数形式化及每实例 2,000 条评论的合成工作负载；主要实验 200 实例，逐元组定价比较 50 实例。"}, "reading": {"en": "Simulation assumes calibrated Bernoulli labels and a perfect escalation judge in its main setting. Ratio-of-expectations quality is approximate; no real-engine Jev evaluation is reported.", "zh": "主要模拟假定校准 Bernoulli 标签与完美升级裁判。期望比值仅近似质量，未报告真实引擎上的 Jev 实测。"}, "source_section": "Sections 4–9, including v2 Section 8.2; PDF pp. 18–19 for skipping", "source": "https://arxiv.org/pdf/2610.08089v2"}, "2610.07953": {"id": "2610.07953", "category": "trustworthiness", "datasets": ["SOM moderation benchmark suite"], "data_role": {"en": "Original evaluation corpus or source-defined study suite", "zh": "原始评测语料或论文定义的研究集合"}, "design": {"en": "Jev/Laya shared compact inputs; fixed-rule-inventory contrasts, paired bootstrap, training-only PluRule test retrieval and leave-one-out OLID/HateXplain retrieval.", "zh": "Jev／Laya 共享紧凑输入，固定规则集合对照与配对 bootstrap；PluRule 测试仅从训练集检索，OLID／HateXplain 采用留一检索。"}, "reading": {"en": "PluRule held-out EMA improves by 5.20 points with precedents. External reference systems are not input-matched; leave-one-out retrieval is distinct from held-out deployment and intervals are not multiplicity-adjusted.", "zh": "PluRule 留出测试中，先例使 EMA 提升 5.20 点。外部参照系统并非输入匹配对照；留一检索不同于独立部署，多重比较区间未经校正。"}, "source_section": "Sections 3–4; PDF pp. 4–9, 12–13", "source": "https://arxiv.org/pdf/2610.07953v1"}, "2610.07730": {"id": "2610.07730", "category": "foundations", "datasets": ["SanSi decision suite"], "data_role": {"en": "Original evaluation corpus or source-defined study suite", "zh": "原始评测语料或论文定义的研究集合"}, "design": {"en": "12,800 training items, 10,027 test decisions from 59 sources, three seeds and matched-recipe single-pass controls; independent transfer and evidence-removal groups.", "zh": "12,800 条训练、59 来源共 10,027 条测试决策，三个种子及匹配训练方案的单轮对照；区分迁移与证据移除组。"}, "reading": {"en": "Accuracy reaches 72.0% at 7.7 times one-loop GPU time. A larger single-pass reference is stronger per compute; confidence rises on wrong answers and ECE increases from loop 3 to 8.", "zh": "准确率达 72.0%，GPU 时间为单轮的 7.7 倍。较大单轮参照按计算预算更强；错误答案置信度也上升，ECE 从第三至第八轮变差。"}, "source_section": "Sections 3–5; PDF pp. 3–7", "source": "https://arxiv.org/pdf/2610.07730v1"}, "2610.07716": {"id": "2610.07716", "category": "foundations", "datasets": ["Readout-stability intervention suite"], "data_role": {"en": "Original evaluation corpus or source-defined study suite", "zh": "原始评测语料或论文定义的研究集合"}, "design": {"en": "91 menu interventions across open decision-model families, with matched-cost cascades and a held-out 250-item CLINC150 test.", "zh": "在开放决策模型族上开展 91 次菜单干预，比较匹配成本级联，并使用 250 条 CLINC150 留出测试。"}, "reading": {"en": "Section 3.2 computes accuracy by comparison with y(x), despite the zero-label claim. Gold-retaining menu curation and ranking stability do not establish deployable label-free accuracy; prose and abstract differ on dataset counts.", "zh": "第 3.2 节准确率计算仍与 y(x) 比较，与零标签主张不一致。保留正确标签的菜单构造及排序稳定不能证明可部署的无标签准确率；摘要与正文数据集计数也不一致。"}, "source_section": "Sections 3–5; PDF pp. 3–7", "source": "https://arxiv.org/pdf/2610.07716v1"}, "2610.09683": {"id": "2610.09683", "category": "foundations", "datasets": ["System Switch Doom decisions"], "data_role": {"en": "Original evaluation corpus or source-defined study suite", "zh": "原始评测语料或论文定义的研究集合"}, "design": {"en": "900 held-out decisions from 42 games; 500 game-level splits and 33 closed-loop games across 11 variants, three seeds each.", "zh": "42 局游戏的 900 条留出决策，500 次按游戏划分；11 个变体各三个种子，共 33 局闭环评测。"}, "reading": {"en": "At 30% deferral, Laya gains 0.13 over random routing, but the gain over the best component is uncertain. No closed-loop run exits the level; oracle agreement, class composition and stale observations limit interpretation.", "zh": "30% 转交率下，Laya 相对随机路由提升 0.13，但相对最佳单组件的优势不确定。闭环运行均未通关；规则标签一致性、类别构成和过时画面限制结论。"}, "source_section": "Sections 3–5; PDF pp. 3–10", "source": "https://arxiv.org/pdf/2610.09683v1"}, "2610.09328": {"id": "2610.09328", "category": "foundations", "datasets": ["Reference-bound Visual Jev evaluation suite"], "data_role": {"en": "Original evaluation corpus or source-defined study suite", "zh": "原始评测语料或论文定义的研究集合"}, "design": {"en": "3,972 binary examples; 200 GRPO training tasks and a custom 897-item MICoBench subset; human comparison on 21 valid tasks.", "zh": "3,972 条二元样本；200 个 GRPO 训练任务，897 条 MICoBench 自定义子集；人工比较涉及 21 个有效任务。"}, "reading": {"en": "Custom score improves from 41.78 to 52.50 versus 51.84 for the 27B reward control. One training run per condition and the small human sample do not establish significant superiority. Mean rewards allow compensation for identity failures; this is not official Jev.", "zh": "自定义分数由 41.78 提至 52.50，27B 奖励对照为 51.84。每条件一次训练及小规模人工样本未证明显著优势；平均奖励允许其他条件抵消身份错误，该模型并非官方 Jev。"}, "source_section": "Sections 3–5; PDF pp. 2–6", "source": "https://arxiv.org/pdf/2610.09328v1"}, "2610.09188": {"id": "2610.09188", "category": "foundations", "datasets": ["Jev multi-teacher distillation suite"], "data_role": {"en": "Original evaluation corpus or source-defined study suite", "zh": "原始评测语料或论文定义的研究集合"}, "design": {"en": "63,135 move pairs from 2,042 games with source-game holdout; paired 4,000-game evaluations and replication. Retrieval uses 80,000 pairs, five seeds and 97 TREC queries.", "zh": "2,042 局棋产生 63,135 个着法对，按来源棋局留出；成对 4,000 局评测并重复验证。检索使用 80,000 个样本对、五个种子和 97 条 TREC 查询。"}, "reading": {"en": "Combining teachers gains 9.6 Elo [4.3,14.9] over Qwen with twice the pairs; replication gains 8.4 [2.9,14.1]. Stricter shuffle and refit controls weaken the advantage. Retrieval intervals include zero; search and hardware differences preclude attributing total strength or speed to Jev alone.", "zh": "双教师相对双倍样本 Qwen 提升 9.6 Elo [4.3,14.9]，重复实验为 8.4 [2.9,14.1]；更严格打乱及重拟合对照削弱优势。检索区间跨零；搜索器和硬件差异不支持将整体棋力或速度归因于 Jev。"}, "source_section": "Sections 3–5; PDF pp. 2–6", "source": "https://arxiv.org/pdf/2610.09188v1"}, "2610.09937": {"id": "2610.09937", "category": "trustworthiness", "datasets": ["HVAC reasoning-demand study suite"], "data_role": {"en": "Original evaluation corpus or source-defined study suite", "zh": "原始评测语料或论文定义的研究集合"}, "design": {"en": "128 fault days from four public building datasets, 53 physical features and nine shift tests; matched-input Jev, Qwen and LightGBM comparisons with day-level bootstrap.", "zh": "四个公开建筑数据集的 128 个故障日、53 个物理特征及九项分布迁移测试；匹配输入比较 Jev、Qwen 与 LightGBM，按日 bootstrap。"}, "reading": {"en": "Jev shift ECE falls from 0.28 to 0.17 after temperature scaling, with a summer exception. Fault-detection F1 0.73 lies inside the always-flag baseline interval. Same-day reference splits favor the supervised model; harmonization artifacts are available on request, not a verified public release.", "zh": "温度缩放使 Jev 迁移 ECE 从 0.28 降至 0.17，但夏季子集例外。故障检测 F1 0.73 落在始终报警基线区间内。同日参考划分有利于监督模型；协调后的数据产物需向作者索取，未核验公开发布。"}, "source_section": "PDF pp. 3–6, 12, 14, 17–20, 25, 29–30, 35", "source": "https://arxiv.org/pdf/2610.09937v1"}, "2610.12292": {"id": "2610.12292", "category": "trustworthiness", "datasets": ["GuardBench"], "data_role": {"en": "Original evaluation corpus or source-defined study suite", "zh": "原始评测语料或论文定义的研究集合"}, "design": {"en": "Seven open models across synthetic policies and three public screening tasks; a 198-label sweep and item bootstrap.", "zh": "七个开放模型，覆盖合成策略与三项公开筛查任务；扫描 198 个名称并按样本 bootstrap。"}, "reading": {"en": "Option-label access is distinct from state-only injection. Models excluding labels from their input are invariant to renaming but remain vulnerable to text changes; synthetic policies do not establish production incident rates.", "zh": "修改选项名称的权限不同于仅修改待评文本。输入不含名称的模型对重命名不变，但仍受文本扰动影响；合成策略不能估计生产事故率。"}, "source_section": "Sections 4–6; PDF pp. 4–10", "source": "https://arxiv.org/pdf/2610.12292v1"}, "2610.11978": {"id": "2610.11978", "category": "trustworthiness", "datasets": ["Jev 13-benchmark evaluation"], "data_role": {"en": "Original evaluation corpus or source-defined study suite", "zh": "原始评测语料或论文定义的研究集合"}, "design": {"en": "Thirteen multiple-choice benchmarks covering knowledge, reasoning and multilingual tasks; measured scores are combined with published scores.", "zh": "十三项知识、推理和多语言选择题基准；实测分数与已发表分数并列。"}, "reading": {"en": "104 of 169 representative/small-model pairs use published scores with different prompts and reasoning settings. Rankings are rough comparisons, not a common-protocol causal test of architecture.", "zh": "代表性和小模型的 169 组组合中 104 组采用已发表分数，提示词和推理设置不同；排名是粗略比较，不能据此归因于架构。"}, "source_section": "Section 3; PDF pp. 3–6", "source": "https://arxiv.org/pdf/2610.11978v1"}, "2610.11901": {"id": "2610.11901", "category": "trustworthiness", "datasets": ["VAST and ZS-CSD"], "data_role": {"en": "Original evaluation corpus or source-defined study suite", "zh": "原始评测语料或论文定义的研究集合"}, "design": {"en": "Full tests of 3,006 VAST and 2,584 ZS-CSD records, four prompted LLM controls, two fine-tuned references and target-cluster bootstrap.", "zh": "完整测试包含 3,006 条 VAST 和 2,584 条 ZS-CSD；四个提示式 LLM、两个微调参照及按目标聚类 bootstrap。"}, "reading": {"en": "Jev macro-F1 is 77.92 and 58.43. Stronger LLMs use batching while Jev uses single records; SFT references have one run and no paired predictions, and intervals lack multiplicity correction.", "zh": "Jev 宏 F1 为 77.92 和 58.43。更强 LLM 批量输入，Jev 逐条输入；微调参照仅一次运行且无配对预测，区间未作多重比较校正。"}, "source_section": "Sections 3–5; PDF pp. 3–5", "source": "https://arxiv.org/pdf/2610.11901v1"}, "2610.11692": {"id": "2610.11692", "category": "foundations", "datasets": ["MiniGrid and Atari Jev RL evaluation"], "data_role": {"en": "Original evaluation corpus or source-defined study suite", "zh": "原始评测语料或论文定义的研究集合"}, "design": {"en": "Nine MiniGrid tasks and three Atari games; three training seeds, 10k/50k-step budgets and evaluation without Jev or auxiliary rewards.", "zh": "九项 MiniGrid 和三项 Atari，三个训练种子，10k/50k 步预算；评估时移除 Jev 和辅助奖励。"}, "reading": {"en": "Jev receives task rules and engineered navigation features that students may lack. Removing navigation lowers FourRooms success from 96% to 40%; ordinal scores are not cardinal Q-values, and reward shaping has no policy-invariance guarantee.", "zh": "Jev 获得学生未必具备的任务规则和导航特征。移除导航后 FourRooms 成功率从 96% 降至 40%；序数评分不等于基数 Q 值，奖励塑形无策略不变保证。"}, "source_section": "Sections 3–5; PDF pp. 4–8", "source": "https://arxiv.org/pdf/2610.11692v1"}, "2610.11436": {"id": "2610.11436", "category": "trustworthiness", "datasets": ["DROP and GSM8K presentation audit"], "data_role": {"en": "Original evaluation corpus or source-defined study suite", "zh": "原始评测语料或论文定义的研究集合"}, "design": {"en": "200 unused source clusters, two grading configurations, paired cue/order interventions, predefined controls and Holm-adjusted inference.", "zh": "200 个未用来源簇、两种判分配置、配对提示与顺序干预、预设控制及 Holm 校正。"}, "reading": {"en": "Sorted-key false acceptance rises from 1% to 26% and 3% to 26.5%. The constructor knows the reference; sorting changes several objects jointly. Six comparator responses remain unknown, and internal causes are not identified.", "zh": "排序字段下错误接受率从 1% 升至 26%、3% 升至 26.5%。构造者知道参照答案，排序联合改变多个对象；对照模型六次响应未知，内部机制未定位。"}, "source_section": "Sections 3–5; PDF pp. 3–6", "source": "https://arxiv.org/pdf/2610.11436v1"}, "2610.11392": {"id": "2610.11392", "category": "trustworthiness", "datasets": ["TypedBench"], "data_role": {"en": "Original evaluation corpus or source-defined study suite", "zh": "原始评测语料或论文定义的研究集合"}, "design": {"en": "Seven task generators, nine suites, hosted Jev plus Laya and Kev checkpoints; paired controls and split-fit temperature scaling.", "zh": "七个任务生成器、九套测试，比较托管 Jev、Laya 与 Kev；配对控制及划分拟合的温度缩放。"}, "reading": {"en": "Jev priority accuracy spans 24 points across friendly wordings; after tier evidence removal it assigns mean 0.89 mass to its top level. Synthetic policies and serving differences limit generalization and latency attribution.", "zh": "友好措辞使 Jev 优先级准确率变化 24 点；移除等级证据后，最高等级仍获平均 0.89 概率。合成策略和服务差异限制泛化与时延归因。"}, "source_section": "Sections 3–4; PDF pp. 3–8", "source": "https://arxiv.org/pdf/2610.11392v1"}, "2610.11379": {"id": "2610.11379", "category": "foundations", "datasets": ["FastJEV six-set evaluation"], "data_role": {"en": "Original evaluation corpus or source-defined study suite", "zh": "原始评测语料或论文定义的研究集合"}, "design": {"en": "Three OmniJev sizes, five public benchmarks and 1,504 reconstructed LIBERO questions; 32 unlabeled calibration inputs and matched L20 timings.", "zh": "三个 OmniJev 规模、五项公开基准和 1,504 条重建 LIBERO 问题；32 条无标签校准输入及匹配 L20 计时。"}, "reading": {"en": "Selected 43.75–45.83% candidate pruning retains 93.66–97.52% mean task scores, yet full-method geometric speedups are below one. The state-plus-pruning ablation is faster; LIBERO is offline QA, not robot success.", "zh": "候选层剪去 43.75–45.83% 后保留平均任务分数的 93.66–97.52%，但完整方法几何平均加速比低于一。状态复用加剪枝消融更快；LIBERO 是离线问答，不是机器人任务成功率。"}, "source_section": "Sections 3–4; PDF pp. 3–9", "source": "https://arxiv.org/pdf/2610.11379v1"}, "2610.11316": {"id": "2610.11316", "category": "foundations", "datasets": ["MetaEncoder 190-task evaluation"], "data_role": {"en": "Original evaluation corpus or source-defined study suite", "zh": "原始评测语料或论文定义的研究集合"}, "design": {"en": "Eleven suites and 190 tasks spanning decisions, multimodal understanding and retrieval; option-format ablations and ten MMLU order permutations.", "zh": "十一套基准、190 个任务，涵盖决策、多模态理解和检索；选项格式消融及十次 MMLU 顺序置换。"}, "reading": {"en": "MetaEncoder trails OpenJev-27B on text decisions and WeMM on MMEB partitions. Format gains and low MMLU order variance do not establish general calibration; no independent weight-file verification was performed.", "zh": "MetaEncoder 在文本决策上落后 OpenJev-27B，在 MMEB 分项上落后 WeMM。格式收益及 MMLU 低顺序方差不能证明普遍校准；本轮未独立核验权重文件。"}, "source_section": "Sections 3–4; PDF pp. 3–8", "source": "https://arxiv.org/pdf/2610.11316v1"}, "2610.11135": {"id": "2610.11135", "category": "trustworthiness", "datasets": ["JevKT seven-dataset suite"], "data_role": {"en": "Original evaluation corpus or source-defined study suite", "zh": "原始评测语料或论文定义的研究集合"}, "design": {"en": "Seven datasets, learner-level splits, nested samples over five seeds, 28 deep KT references and learner-cluster bootstrap.", "zh": "七个数据集、按学习者划分、五种子嵌套样本、28 个深度 KT 参照及学习者聚类 bootstrap。"}, "reading": {"en": "Zero-shot mean AUC is .706 and eight-learner JevKT .722; the average crossover occurs between 64 and 128 learners. Adapter models emit probabilities as text; one closed model and limited reasoning backbones constrain attribution.", "zh": "零样本平均 AUC 为 .706，八学习者 JevKT 为 .722；平均交叉点在 64 至 128 人之间。适配器模型以文本给出概率；单一闭源模型及有限推理骨干限制归因。"}, "source_section": "Sections 4–5; PDF pp. 4–8", "source": "https://arxiv.org/pdf/2610.11135v1"}, "2610.10615": {"id": "2610.10615", "category": "foundations", "datasets": ["JevForest acquisition evaluation"], "data_role": {"en": "Original evaluation corpus or source-defined study suite", "zh": "原始评测语料或论文定义的研究集合"}, "design": {"en": "MiniBooNE across three joint data/forest seeds and balanced AG News/TREC pilots of 48/24 test items with a shared masked predictor.", "zh": "MiniBooNE 使用三个联合数据/森林种子；AG News/TREC 平衡试验含 48/24 条测试，固定掩码预测器。"}, "reading": {"en": "Four-question accuracy is .729 on AG News and .667 on TREC, with reversed baseline rankings. Eight-question batches are faster, cheaper and more accurate; small selected samples and exploratory configurations preclude general dominance.", "zh": "四问题准确率在 AG News 为 .729、TREC 为 .667，对照排名反转。八问题批量更快、更便宜且更准；小规模选取样本和探索性配置不能证明普遍优势。"}, "source_section": "Sections 3–4; PDF pp. 3–9", "source": "https://arxiv.org/pdf/2610.10615v1"}}, "timeline": {"dates": ["2026-06-04", "2026-06-05", "2026-06-06", "2026-06-07", "2026-06-08", "2026-06-09", "2026-06-10", "2026-06-11", "2026-06-12", "2026-06-13", "2026-06-14", "2026-06-15", "2026-06-16", "2026-06-17", "2026-06-18", "2026-06-19", "2026-06-20", "2026-06-21", "2026-06-22", "2026-06-23", "2026-06-24", "2026-06
